<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stigma FBS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="container topbar">
      <h1>
        <a href="{{ url_for('index') }}" class="brand-link">
          <img src="{{ url_for('logo_png') }}" alt="Stigma FBS" class="brand-logo" />
          <span>Stigma FBS</span>
          <img src="{{ url_for('icon_ozon_png') }}" alt="Ozon" class="brand-ozon-logo" />
        </a>
      </h1>
      <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('orders') }}">Заказы Ozon</a>
        <a href="{{ url_for('orders_wb') }}">Заказы WB</a>
      </nav>
    </header>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="alerts">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
  </html>
